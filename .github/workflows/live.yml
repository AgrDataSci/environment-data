name: live

on:
  pull_request:
    paths: ["skills/**", "tests/**"]
  push:
    branches: [main]
    paths: ["skills/**", "tests/**"]
  schedule:
    - cron: "23 5 * * 1" # Mondays, to catch a data store that moved or changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Two points from every store
        run: python3 tests/smoke.py
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
